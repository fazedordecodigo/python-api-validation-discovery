# Pacote APM das validações de qualidade e segurança.
# name e version são obrigatórios (semver).
# Não há chave de topo `tools` no manifesto (spec OpenAPM / working draft).
name: python-api-validation-discovery
version: 0.1.0
description: >
  Validações de qualidade e segurança (Ruff, mypy, Bandit, gitleaks,
  pip-audit, Trivy), loop de entrega do agente e Schemathesis no
  contrato OpenAPI, para desenvolvimento Python numa plataforma de
  dados na AWS.
author: Emerson Delatorre
license: MIT
type: hybrid
includes: auto

# windsurf é o alvo oficial do APM para o Devin Desktop. O catálogo
# não tem slug `devin`; valor desconhecido é erro de parse.
targets:
  - windsurf
  - claude

# scripts: é o mapa oficial de comandos nomeados (apm run <nome>).
scripts:
  start: python3 scripts/agent_loop.py --demo
  loop: python3 scripts/agent_loop.py --config loop.yaml
  lint: sh scripts/lint.sh
  test: sh scripts/test.sh
  audit: sh scripts/audit.sh
  schemathesis: python3 -m schemathesis run {spec}
