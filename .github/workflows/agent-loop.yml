name: agent-loop

on:
  pull_request:

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A base do PR precisa estar no clone; senão o diff contra origin/<base> falha.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas Python
        run: python3 -m pip install ruff mypy bandit pip-audit pytest schemathesis

      - name: Instalar gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: Instalar trivy
        run: |
          curl -sSfL -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Rodar o loop
        run: python3 scripts/agent_loop.py --base "origin/${{ github.base_ref }}"
